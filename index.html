<!doctype html>
<html lang="ja">
<head>

<!-- スマホで全画面（2026-11-23 作者「全画面をスマホ用に」）：ホーム画面に置いて開くと全画面。iPhone はこの方法だけ -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STERNENRING">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<style>
  :root { --bg: #1b1a22; --ink: #efe7d4; --paper: #e8dfca; --edge: #9c8f74; --accent: #c9a25e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage, #paper { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; image-rendering: pixelated; }
  [hidden] { display: none !important; }
  /* 右上：効果音の大きさ（DEV-BOOK-001 rev2）・曲の大きさ（rev3）と表示切替を横に並べる */
  #topright { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 6px; }
  #render-toggle, #sound-toggle, #bgm-toggle, #room-toggle, #cam-toggle, #status-toggle, #dev-toggle, #fs-toggle { background: rgba(27,26,34,.72); color: var(--ink); border: 1px solid var(--edge); border-radius: 3px; padding: 5px 10px; font: 13px sans-serif; white-space: nowrap; }
  @media (max-width: 420px) { #topright { gap: 4px; right: max(8px, env(safe-area-inset-right)); } #render-toggle, #sound-toggle, #bgm-toggle, #room-toggle, #cam-toggle, #status-toggle, #dev-toggle, #fs-toggle { padding: 5px 6px; } }
  /* 右上のボタンが3つになったので（rev3）、幅460px以下では地名の下に「仮」を置き、ボタンと重ねない */
  @media (max-width: 460px) { body #hud { flex-direction: column; align-items: flex-start; gap: 4px; } }
  #perf { position: fixed; left: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 34px); background: rgba(27,26,34,.8); color: #cfe3c0; padding: 2px 6px; font: 11px/1.4 monospace; pointer-events: none; white-space: pre-line; }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  #map-title { background: rgba(27,26,34,.72); padding: 4px 10px; border: 1px solid var(--edge); border-radius: 3px; font-size: 15px; letter-spacing: .08em; }
  #map-badge { background: var(--paper); color: #4a4436; padding: 2px 6px; border-radius: 2px; font-size: 11px; font-family: sans-serif; }
  #status { position: fixed; inset: auto 12px 12px 12px; white-space: pre-wrap; background: rgba(27,26,34,.9); padding: 10px; border: 1px solid var(--edge); font: 13px/1.5 sans-serif; }
  #status.error { color: #ffb4a8; border-color: #b0564a; }
  #pad { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom));
    width: 156px; height: 156px; display: none; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 4px; touch-action: none; }
  #pad button { all: unset; background: rgba(232,223,202,.22); border: 1px solid rgba(232,223,202,.45); border-radius: 8px; position: relative; }
  #pad button.on { background: rgba(201,162,94,.55); }
  #pad button::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border: 9px solid transparent; transform: translate(-50%, -50%); }
  #pad [data-dir=up] { grid-area: 1 / 2; }    #pad [data-dir=up]::after { border-bottom-color: var(--ink); margin-top: -4px; }
  #pad [data-dir=left] { grid-area: 2 / 1; }  #pad [data-dir=left]::after { border-right-color: var(--ink); margin-left: -4px; }
  #pad [data-dir=right] { grid-area: 2 / 3; } #pad [data-dir=right]::after { border-left-color: var(--ink); margin-left: 4px; }
  #pad [data-dir=down] { grid-area: 3 / 2; }  #pad [data-dir=down]::after { border-top-color: var(--ink); margin-top: 4px; }
  @media (pointer: coarse), (max-width: 820px) { #pad { display: grid; } }
  /* 開始演出（DEV-BOOK-001）：右下の「とばす」。左下の十字ボタン・右上の表示切替／?cam=1 のパネルと重ならない */
  #intro-skip { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); min-width: 88px; min-height: 44px;
    background: rgba(27,26,34,.78); color: var(--ink); border: 1px solid var(--accent); border-radius: 6px; font: 15px "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .1em; }
  body.intro #hud { visibility: hidden; } /* 演出中はマップ名を出さない（終わったら出る） */
  /* 表紙（rev4）：閉じた本の上の「タップしてはじめる」。画面全体が押せる。右上の音・曲・表示のボタンはその上に出て、先に音量を変えられる */
  #intro-cover { all: unset; position: fixed; inset: 0; cursor: pointer; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: max(18vh, calc(env(safe-area-inset-bottom) + 72px)); box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  #intro-cover #cover-label { background: rgba(27,26,34,.78); color: var(--ink); border: 1px solid var(--accent); border-radius: 6px; padding: 12px 22px;
    font: 17px "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .14em; animation: cover-breathe 2.4s ease-in-out infinite; }
  #intro-cover:focus-visible #cover-label { outline: 2px solid var(--accent); outline-offset: 3px; }
  @keyframes cover-breathe { 50% { opacity: .62; } }
  @media (prefers-reduced-motion: reduce) { #intro-cover #cover-label { animation: none; } }
  body.cover #pad { visibility: hidden; }
  /* 幅400px以下（rev4・320〜375px）：右上のボタン3つで一行を使い、地名と「仮配置」はその下の行へ。?cam=1 のパネルはさらにその下 */
  @media (max-width: 400px) {
    #hud { top: calc(max(10px, env(safe-area-inset-top)) + 38px); }
    #topright { left: max(8px, env(safe-area-inset-left)); justify-content: flex-end; }
    #render-toggle, #sound-toggle, #bgm-toggle, #room-toggle, #cam-toggle, #status-toggle, #dev-toggle, #fs-toggle { font-size: 12px; padding: 5px 6px; }
    #perf { top: calc(max(10px, env(safe-area-inset-top)) + 102px); }
    body #cam-panel { top: calc(max(10px, env(safe-area-inset-top)) + 102px) !important; }
    #intro-skip { min-width: 76px; }
  }
  /* 戦闘：バトル試作をフィールドの上に重ねる（2026-11-22） */
  #battle-overlay { position: fixed; inset: 0; z-index: 80; background: #000; animation: battle-in .5s ease-out; }
  #battle-overlay iframe { width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity .25s; }
  #battle-overlay.ready iframe { opacity: 1; } /* 試作の画面が切りかわるまで見せない（タイトルが一瞬見えないように） */
  #battle-back { position: absolute; left: 50%; transform: translateX(-50%); top: max(6px, env(safe-area-inset-top)); z-index: 2; background: rgba(27,26,34,.82); color: #f6e2a8; border: 1px solid #c9a050; border-radius: 4px; padding: 6px 14px; font: 13px sans-serif; opacity: .75; }
  #battle-overlay:not(.status) #battle-back { left: max(8px, env(safe-area-inset-left)); top: calc(max(6px, env(safe-area-inset-top)) + 34px); transform: none; font-size: 12px; padding: 4px 10px; } /* 戦闘では左上（行動順の帯に重ねない。2026-11-22） */
  #battle-back.done { opacity: 1; font-size: 15px; padding: 8px 20px; background: rgba(60,40,20,.92); }
  @keyframes battle-in { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
  /* エンカウント（2026-11-22 作者「もっとかっこよく」）：白い光とゆれ → 寄って色があせる → 金の魔法陣 → 金のひび → 黒い破片が四方から → 戦闘へ */
  body.encountering #paper, body.encountering #stage { animation: enc-zoom 1.3s cubic-bezier(.5,0,.6,1) forwards; }
  @keyframes enc-zoom { 0% { transform: none; filter: none; } 6% { transform: translate(-8px,4px) scale(1.01); } 12% { transform: translate(7px,-5px) scale(1.02); } 18% { transform: translate(-4px,3px) scale(1.03); } 60% { transform: scale(1.22); filter: saturate(.25) brightness(.8) contrast(1.2); } 100% { transform: scale(1.35); filter: saturate(0) brightness(.4) blur(3px); } }
  #enc-fx { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; animation: enc-out 1.7s linear forwards; }
  #enc-fx .ef-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, #fff8e0 40%, rgba(255,240,200,.6) 100%); animation: enc-flash .32s ease-out forwards; }
  #enc-fx .ef-ring { position: absolute; left: 50%; top: 50%; width: min(80vw, 80vh); height: min(80vw, 80vh); transform: translate(-50%,-50%) scale(.2) rotate(0deg); opacity: 0; fill: none; stroke: #f2d48a; stroke-width: 2.4; filter: drop-shadow(0 0 6px rgba(242,212,138,.9)); animation: enc-ring 1.1s cubic-bezier(.2,.8,.2,1) .12s forwards; }
  #enc-fx .ef-ring .thin, #enc-fx .ef-ring line { stroke-width: 1.2; }
  #enc-fx .ef-crack { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #ffe6a0; stroke-width: .5; stroke-linejoin: round; filter: drop-shadow(0 0 2px #ffd27a) drop-shadow(0 0 6px rgba(255,190,80,.8)); stroke-dasharray: 80; stroke-dashoffset: 80; animation: enc-crack .32s ease-out .5s forwards; }
  #enc-fx .ef-shards b { position: absolute; inset: 0; background: linear-gradient(135deg, #14101e, #05040a); transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1.4); opacity: 0; animation: enc-shard .38s cubic-bezier(.7,0,.3,1) forwards; }
  #enc-fx .ef-shards b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 47%, rgba(242,212,138,.9) 50%, transparent 53%); opacity: .5; }
  @keyframes enc-flash { from { opacity: 1; } to { opacity: 0; } }
  @keyframes enc-ring { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(0deg); } 25% { opacity: 1; } 75% { opacity: 1; transform: translate(-50%,-50%) scale(1.05) rotate(110deg); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.5) rotate(150deg); } }
  @keyframes enc-crack { to { stroke-dashoffset: 0; } }
  @keyframes enc-shard { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes enc-out { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
  #battle-overlay[data-wait] { background: transparent; animation: none; }
  #battle-overlay[data-wait] iframe, #battle-overlay[data-wait] #battle-back { opacity: 0 !important; }
  /* 戦闘から戻る：明るく光って消える */
  #battle-overlay.closing { animation: battle-out .7s ease-in forwards; pointer-events: none; }
  @keyframes battle-out { 0% { opacity: 1; filter: brightness(1); transform: none; } 35% { opacity: 1; filter: brightness(2.2); } 100% { opacity: 0; filter: brightness(1.4); transform: scale(1.05); } }
  /* メニュー：本のページをめくるように開く・閉じる */
  #battle-overlay.status { background: transparent; perspective: 1800px; animation: none; }
  #battle-overlay.status iframe { transform-origin: 0% 50%; animation: page-in .55s cubic-bezier(.2,.8,.25,1) both; box-shadow: -20px 0 40px rgba(0,0,0,.5); }
  #battle-overlay.status.closing { animation: none; }
  #battle-overlay.status.closing iframe { animation: page-out .5s cubic-bezier(.5,0,.75,.2) forwards; }
  @keyframes page-in { from { transform: rotateY(-100deg); filter: brightness(.4); } to { transform: rotateY(0); filter: brightness(1); } }
  @keyframes page-out { from { transform: rotateY(0); filter: brightness(1); } to { transform: rotateY(-100deg); filter: brightness(.4); } }
  /* 言葉の窓と「調べる」（2026-11-22） */
  #msg { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(720px, calc(100% - 32px)); z-index: 60; background: linear-gradient(180deg, rgba(34,24,14,.94), rgba(20,14,8,.96)); border: 1px solid #c9a050; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.5), inset 0 0 0 3px rgba(201,160,80,.18); padding: 14px 20px; color: #f3e6c4; font: 16px/1.7 "Shippori Mincho B1", serif; animation: msg-in .22s ease-out; }
  #msg p { margin: 0; } #msg p.who { color: #e8c47a; font-size: 13px; letter-spacing: 2px; margin-bottom: 2px; } #msg p.note { color: #ffd77a; font-weight: 700; margin-top: 4px; } #msg p.who.party { color: #9fd4ff; } /* 仲間の言葉は名前を青く（町の人と見分ける） */
  /* 立ち絵の会話（2026-11-24 作者「立ち絵がでてサウンドノベル的な会話形式のイベントがあってもいいな」）：左右に立ち絵、話す人は明るく少し前に、聞く人は少し暗く */
  #novel { position: fixed; inset: 0; z-index: 55; pointer-events: none; background: linear-gradient(180deg, rgba(10,6,2,0) 35%, rgba(10,6,2,.55)); animation: novel-in .25s ease-out; }
  #novel .seat { position: absolute; bottom: 0; height: min(94vh, 85vw); aspect-ratio: 768 / 1152; transition: filter .22s, transform .22s, opacity .22s; transform-origin: 50% 100%; }
  #novel .seat[data-side="left"] { right: 50%; margin-right: clamp(-80px, 14vw - 90px, 130px); }
  #novel .seat[data-side="right"] { left: 50%; margin-left: clamp(-80px, 14vw - 90px, 130px); }
  #novel .seat.dim { filter: brightness(.5) saturate(.75); transform: translateY(1.5%) scale(.96); }
  #novel .seat.empty { opacity: 0; }
  #novel.away .seat { opacity: 0; transform: translateY(8%); } /* 地の文・演出の行は立ち絵を下げて、町の様子を見せる（2026-11-25） */
  #novel.away { background: none; }
  #novel .seat img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
  #novel .seat img.body { inset: 0; width: 100%; height: 100%; }
  @keyframes novel-in { from { opacity: 0; } to { opacity: 1; } }
  #msg.novel { width: min(860px, calc(100% - 24px)); min-height: 96px; }
  #msg::after { content: "▼"; position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: #c9a050; animation: msg-blink 1s infinite; }
  @keyframes msg-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
  @keyframes msg-blink { 50% { opacity: .2; } }
  #act-btn { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom)); z-index: 40; width: 72px; height: 72px; border-radius: 50%; background: rgba(232,223,202,.22); border: 1px solid rgba(232,223,202,.45); color: #f3e6c4; font: 14px "Shippori Mincho B1", serif; }
  #act-btn:active { background: rgba(201,162,94,.55); }
  /* 設定の統一（2026-11-22）：右上はメニューだけ。音・曲・表示・内装はメニューの「設定」へ。カメラは、調整のパネルが開いているあいだだけ「カメラ：閉じる」を出す */
  #sound-toggle, #bgm-toggle, #room-toggle, #render-toggle { display: none !important; }
  #cam-toggle:not([aria-pressed="true"]) { display: none !important; }
  #dev-pos { position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 45; background: rgba(10,12,30,.75); color: #f6e2a8; padding: 3px 10px; border-radius: 4px; font: 12px monospace; pointer-events: none; }
  #dev-toggle { opacity: .7; font-size: 12px !important; }
  /* 開発者の半透明の窓（2026-11-22）：右に置き、うしろのフィールドが見える */
  #battle-overlay.status.devwin { inset: auto; left: max(10px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 44px); width: min(460px, calc(100vw - 20px)); height: min(76vh, 720px); background: transparent; perspective: none; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #battle-overlay.status.devwin iframe { background: transparent; animation: none; box-shadow: none; }
  #battle-overlay.status.devwin #battle-back { top: auto; bottom: 8px; }
</style>
<script>
// データ（JSON）も、プログラムが届くのを待たずに、ここで読みはじめる。src/data.js・src/main.js が SR_PRE.take で受け取る（1回だけ。受け取らなければふつうに読む）
window.SR_PRE = (() => {
  const got = {};
  const get = (p) => got[p] || (got[p] = fetch(p, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw Error(p + ' を読めません (' + r.status + ')'); return r.json(); }));
  const soft = (pr) => { pr.catch(() => {}); return pr; }; // 先読みの失敗は、本番で読むときに出す
  ['data/world.json', 'data/collision.json', 'data/assets.json', 'data/stage-style.json', 'data/audio.json', 'data/dialogue.json'].forEach((p) => soft(get(p)));
  soft(get('data/world.json').then((w) => w.maps.forEach((id) => soft(get('data/maps/' + id + '.json')))));
  const imgs = [];
  soft(get('data/assets.json').then((l) => l.assets.forEach((a) => {
    if (a.regionsPath) soft(get(a.regionsPath));
    if (a.path && /\.png$/.test(a.path)) { const im = new Image(); im.src = a.path; imgs.push(im); } // キャラの絵も先に
  })));
  return { take(p) { const pr = got[p]; delete got[p]; return pr; } };
})();
</script>

<script>
// 公開ページでは、プログラムをいつも新しい版で読む（sw.js。2026-11-24 公開したすぐあとに古いプログラムが残って、扉の音が鳴らなかった）。手もとの試遊（127.0.0.1）は ?sw=1 のときだけ
if ('serviceWorker' in navigator && (/\.github\.io$/.test(location.hostname) || /[?&]sw=1/.test(location.search))) navigator.serviceWorker.register('sw.js').catch(() => {});
